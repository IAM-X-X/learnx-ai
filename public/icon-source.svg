<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Brain/learning symbol — stylized -->
  <g transform="translate(256, 256)">
    <!-- Outer ring -->
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
    <!-- Brain shape -->
    <path d="M -70,-30 C -70,-60 -50,-80 -20,-80 C 0,-90 30,-85 50,-70 C 75,-55 80,-25 70,0 C 75,20 65,45 40,55 C 20,65 -10,60 -25,50 C -45,55 -65,40 -70,15 C -78,5 -78,-15 -70,-30 Z"
          fill="rgba(255,255,255,0.95)"/>
    <!-- Brain fold lines -->
    <path d="M -30,-50 C -20,-30 -25,-10 -15,10 C -5,25 5,30 15,20"
          fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20,-50 C 35,-30 30,-10 40,10 C 48,25 45,35 35,40"
          fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="3" stroke-linecap="round"/>
    <!-- Sparkles -->
    <circle cx="55" cy="-55" r="6" fill="url(#accent)"/>
    <circle cx="65" cy="-40" r="3" fill="url(#accent)" opacity="0.6"/>
    <circle cx="48" cy="-68" r="2.5" fill="url(#accent)" opacity="0.4"/>
  </g>
</svg>
